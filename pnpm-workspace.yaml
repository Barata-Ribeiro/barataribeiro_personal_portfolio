packages:
  - '.'
allowBuilds:
  '@swc/core': true
  '@tailwindcss/oxide': true
  msw: true
  sharp: true
  unrs-resolver: true
supportedArchitectures:
  os:
    - win32
    - darwin
    - current
  cpu:
    - x64
    - arm64
minimumReleaseAgeExclude:
  - '@next/swc-win32-arm64-msvc@16.3.2'
  - eslint@10.9.0 || 10.10.0
  - next@16.3.2
  - shadcn@4.19.0
  - lucide-react@1.41.0
